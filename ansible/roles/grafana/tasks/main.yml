# This file was edited with the assistance of an AI model and requires human review from the contributor.
---
# An empty basic_auth_users would leave prometheus (and its remote-write
# endpoint) open, so refuse to render it without credentials
- name: Check prometheus basic auth users are configured
  ansible.builtin.assert:
    that:
      - grafana_prometheus_password_hash is defined
      - grafana_datalabs | selectattr('prometheus_user', 'defined') | rejectattr('prometheus_password_hash', 'defined') | list | length == 0
    fail_msg: >-
      Set grafana_prometheus_password_hash, and prometheus_password_hash for every
      entry in grafana_datalabs that has a prometheus_user

# These names end up in file paths, PromQL selectors and dashboard UIDs
- name: Check datalab names and folders are safe to use
  ansible.builtin.assert:
    that:
      - item.datalab is match('^[A-Za-z0-9_-]{1,32}$')
      - item.folder | default(item.datalab) is match('^[A-Za-z0-9_ -]+$')
    fail_msg: "datalab names may only contain letters, digits, '-' and '_' (max 32 chars); folders may also contain spaces"
  loop: "{{ grafana_datalabs }}"
  loop_control:
    label: "{{ item.datalab }}"

- name: Make config dirs for prometheus and grafana
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .prometheus
    - .blackbox
    - .grafana/provisioning/datasources
    - .grafana/provisioning/dashboards
    - .grafana/provisioning/alerting
    - .grafana/dashboards
    - .grafana/datalab-dashboards

- name: Render prometheus config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: prometheus.yml.j2, dest: .prometheus/prometheus.yml }
    - { src: web.yml.j2, dest: .prometheus/web.yml }
  register: grafana_prom_config_changed

- name: Copy blackbox exporter config
  ansible.builtin.copy:
    src: blackbox/config.yml
    dest: .blackbox/config.yml
    mode: "0644"
  register: grafana_blackbox_config_changed

- name: Render grafana datasource provisioning
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: .grafana/provisioning/datasources/datasources.yml
    mode: "0644"
  register: grafana_datasource_changed

- name: Render grafana dashboard provider config
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: .grafana/provisioning/dashboards/dashboards.yml
    mode: "0644"
  register: grafana_dashboard_provider_changed

- name: Sync grafana dashboard JSON files
  ansible.posix.synchronize:
    src: dashboards/
    dest: .grafana/dashboards/
    delete: true
    recursive: true
  register: grafana_dashboards_changed

- name: Make per-datalab dashboard folders
  ansible.builtin.file:
    path: "{{ ansible_user_home_dir }}/.grafana/datalab-dashboards/{{ item.folder | default(item.datalab) }}"
    state: directory
    mode: "0755"
  loop: "{{ grafana_datalabs }}"
  loop_control:
    label: "{{ item.folder | default(item.datalab) }}"

# Each datalab gets its own dashboard in its `folder` (default: its own name),
# with every query pinned to that datalab so it can be shared via folder permissions
- name: Render per-datalab grafana dashboards
  ansible.builtin.template:
    src: datalab-dashboard.json.j2
    dest: "{{ ansible_user_home_dir }}/.grafana/datalab-dashboards/{{ item.folder | default(item.datalab) }}/{{ item.datalab }}.json"
    mode: "0644"
  loop: "{{ grafana_datalabs }}"
  loop_control:
    label: "{{ item.datalab }}"
  register: grafana_datalab_dashboards_rendered

- name: Find existing per-datalab grafana dashboards
  ansible.builtin.find:
    paths: "{{ ansible_user_home_dir }}/.grafana/datalab-dashboards"
    patterns: "*.json"
    recurse: true
  register: grafana_datalab_dashboards_found

- name: Remove dashboards of datalabs no longer in the inventory (or moved folder)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ grafana_datalab_dashboards_found.files | map(attribute='path')
       | reject('in', grafana_datalab_dashboards_rendered.results | map(attribute='dest'))
       | list }}
  register: grafana_datalab_dashboards_removed

- name: Sync grafana alert provisioning files
  ansible.builtin.copy:
    src: alerting/
    dest: .grafana/provisioning/alerting/
    mode: "0644"
  register: grafana_alerting_changed

- name: Sync prometheus image build context
  ansible.posix.synchronize:
    src: prometheus-image/
    dest: .prometheus-image/
    delete: true
  register: prometheus_image_context_changed

- name: Sync blackbox exporter image build context
  ansible.posix.synchronize:
    src: blackbox-image/
    dest: .blackbox-image/
    delete: true
  register: blackbox_image_context_changed

- name: Sync grafana image build context
  ansible.posix.synchronize:
    src: grafana-image/
    dest: .grafana-image/
    delete: true
  register: grafana_image_context_changed

- name: Build prometheus image
  community.docker.docker_image:
    name: datalab-prometheus
    source: build
    state: present
    force_source: "{{ prometheus_image_context_changed.changed }}"
    build:
      path: .prometheus-image
      pull: true
  register: prometheus_image_built

- name: Build blackbox exporter image
  community.docker.docker_image:
    name: datalab-blackbox-exporter
    source: build
    state: present
    force_source: "{{ blackbox_image_context_changed.changed }}"
    build:
      path: .blackbox-image
      pull: true
  register: blackbox_image_built

- name: Build grafana image
  community.docker.docker_image:
    name: datalab-grafana
    source: build
    state: present
    force_source: "{{ grafana_image_context_changed.changed }}"
    build:
      path: .grafana-image
      pull: true
  register: grafana_image_built

# Only listen on localhost: an exposed blackbox exporter can be used to make
# arbitrary outbound requests from this host
- name: Launch blackbox exporter container
  community.docker.docker_container:
    name: blackbox-exporter
    image: datalab-blackbox-exporter
    network_mode: host
    recreate: "{{ grafana_blackbox_config_changed.changed or blackbox_image_built.changed }}"
    restart_policy: always
    volumes:
      - ./.blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=127.0.0.1:9115

- name: Launch prometheus container
  community.docker.docker_container:
    name: prometheus
    image: datalab-prometheus
    network_mode: host
    recreate: "{{ grafana_prom_config_changed.changed or prometheus_image_built.changed }}"
    restart_policy: always
    volumes:
      - ./.prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-remote-write-receiver

- name: Populate grafana env vars
  ansible.builtin.set_fact:
    grafana_env:
      GF_SERVER_ROOT_URL: https://{{ server_url }}

- name: Add SMTP environment if configured
  ansible.builtin.set_fact:
    grafana_env: "{{ grafana_env | combine(smtp_env) }}"
  vars:
    smtp_env:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "{{ grafana_smtp_host }}:{{ grafana_smtp_port | default('587') }}"
      GF_SMTP_USER: "{{ grafana_smtp_user }}"
      GF_SMTP_PASSWORD: "{{ grafana_smtp_password }}"
      GF_SMTP_FROM_ADDRESS: "{{ grafana_smtp_from_address }}"
      GF_SMTP_FROM_NAME: "{{ grafana_smtp_from_name }}"
  when: grafana_smtp_host is defined

- name: Launch grafana container
  community.docker.docker_container:
    name: grafana
    image: datalab-grafana
    network_mode: host
    recreate: "{{ grafana_datasource_changed.changed or grafana_dashboard_provider_changed.changed or grafana_dashboards_changed.changed or grafana_datalab_dashboards_rendered.changed or grafana_datalab_dashboards_removed.changed or grafana_alerting_changed.changed or grafana_image_built.changed }}"
    restart_policy: always
    volumes:
      - grafana-data:/var/lib/grafana
      - ./.grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./.grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./.grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./.grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.grafana/datalab-dashboards:/var/lib/grafana/datalab-dashboards:ro
    ports:
      - 3000:3000
    env: "{{ grafana_env }}"
