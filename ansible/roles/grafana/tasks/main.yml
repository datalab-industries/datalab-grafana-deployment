---
- name: Make config dir for prometheus
  ansible.builtin.file:
    path: .prometheus
    state: directory
    mode: "0755"

- name: Render config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: prometheus.yml.j2, dest: .prometheus/prometheus.yml }
    - { src: web.yml.j2, dest: .prometheus/web.yml }
  register: prom_config_changed

- name: Launch prometheus container
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:v3.6.0
    network_mode: host
    recreate: "{{ prom_config_changed.changed }}"
    restart_policy: always
    volumes:
      - ./.prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-remote-write-receiver

- name: Populate grafana env vars
  ansible.builtin.set_fact:
    grafana_env:
      GF_SERVER_ROOT_URL: https://{{ server_url }}

- name: Add SMTP environment if configured
  ansible.builtin.set_fact:
    grafana_env: "{{ grafana_env | combine(smtp_env) }}"
  vars:
    smtp_env:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "{{ grafana_smtp_host }}:{{ grafana_smtp_port | default('587') }}"
      GF_SMTP_USER: "{{ grafana_smtp_user }}"
      GF_SMTP_PASSWORD: "{{ grafana_smtp_password }}"
      GF_SMTP_FROM_ADDRESS: "{{ grafana_smtp_from_address }}"
      GF_SMTP_FROM_NAME: "{{ grafana_smtp_from_name }}"
  when: grafana_smtp_host is defined

- name: Launch grafana container
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:11.4.0
    network_mode: host
    restart_policy: always
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    env: "{{ grafana_env }}"
